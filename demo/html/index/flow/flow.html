<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flow Editor</title>
    <link rel="stylesheet" href="../../../css/flow.css">
    <link rel="stylesheet" href="../../../css/layui.css">
    <script src="../../../js/jquery-3.6.0.min.js"></script>
    <script src="../../../js/layui.js"></script>
    <script src="../../../../source/processon_files/flow.js"></script>
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header">
            <div class="layui-logo">Flow Editor</div>
            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item"><a href="#">首页</a></li>
                <li class="layui-nav-item"><a href="#">文档</a></li>
                <li class="layui-nav-item"><a href="#">关于</a></li>
            </ul>
        </div>
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree" lay-filter="test">
                    <li class="layui-nav-item layui-nav-itemed">
                        <a class="" href="javascript:;">节点管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="javascript:;" id="add_node">添加节点</a></dd>
                            <dd><a href="javascript:;" id="delete_node">删除节点</a></dd>
                            <dd><a href="javascript:;" id="edit_node">编辑节点</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">流程管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="javascript:;" id="save_flow">保存流程</a></dd>
                            <dd><a href="javascript:;" id="load_flow">加载流程</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
        </div>
        <div class="layui-body">
            <div id="flow_container"></div>
        </div>
        <div class="layui-footer">
            Flow Editor © 2024
        </div>
    </div>
    <div id="add_job" style="display: none;">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">任务名称</label>
                <div class="layui-input-block">
                    <input type="text" name="name" required  lay-verify="required" placeholder="请输入任务名称" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">任务描述</label>
                <div class="layui-input-block">
                    <textarea name="desc" required lay-verify="required" placeholder="请输入任务描述" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="formDemo">立即提交</button>
                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
            </div>
        </form>
    </div>
    <div id="globalVars" style="display: none;">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">变量名</label>
                <div class="layui-input-block">
                    <input type="text" name="varName" required lay-verify="required" placeholder="请输入变量名" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">变量值</label>
                <div class="layui-input-block">
                    <input type="text" name="varValue" required lay-verify="required" placeholder="请输入变量值" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="addVar">添加变量</button>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="updateVar">更新变量</button>
                    <button class="layui-btn layui-btn-danger" lay-submit lay-filter="deleteVar">删除变量</button>
                </div>
            </div>
        </form>
        <table class="layui-table" lay-data="{page: false, limit: 10}" lay-filter="varList">
            <thead>
                <tr>
                    <th lay-data="{field:'name', width:200}">变量名</th>
                    <th lay-data="{field:'value', width:300}">变量值</th>
                </tr>
            </thead>
            <tbody id="varListBody"></tbody>
        </table>
    </div>
    <div class="layui-card">
        <div class="layui-card-body">
            <div id="dock">
                <ul id="dock_buttons">
                    <li><a class="layui-icon layui-icon-add-1" id="dock_btn_add" title="添加任务"></a></li>
                    <li><a class="layui-icon layui-icon-template-1" id="dock_btn_edit" title="编辑任务"></a></li>
                    <li><a class="layui-icon layui-icon-delete" id="dock_btn_delete" title="删除任务"></a></li>
                    <li><a class="layui-icon layui-icon-set-fill" id="dock_btn_global_vars" title="全局变量"></a></li>
                    <li><a class="layui-icon layui-icon-play" id="dock_btn_execute" title="执行流程"></a></li>
                </ul>
            </div>
        </div>
    </div>
    <script>
        layui.use(['form', 'layer', 'table'], function() {
            var form = layui.form;
            var layer = layui.layer;
            var table = layui.table;
            
            // 监听提交
            form.on('submit(formDemo)', function(data) {
                layer.msg(JSON.stringify(data.field));
                return false;
            });
            
            // 监听全局变量操作
            form.on('submit(addVar)', function(data) {
                addGlobalVariable(data.field.varName, data.field.varValue);
                return false;
            });
            
            form.on('submit(updateVar)', function(data) {
                updateGlobalVariable(data.field.varName, data.field.varValue);
                return false;
            });
            
            form.on('submit(deleteVar)', function(data) {
                deleteGlobalVariable(data.field.varName);
                return false;
            });
            
            // 点击全局变量按钮
            $('#dock_btn_global_vars').click(function() {
                showGlobalVars();
            });
            
            // 点击执行按钮
            $('#dock_btn_execute').click(function() {
                executeFlow();
            });
        });
    </script>
</body>
</html>
